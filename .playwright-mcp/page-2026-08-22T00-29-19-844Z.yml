                - paragraph [ref=f13e46]: Di tulisan ini kita membahas cara setup project Laravel baru, menghubungkan koneksi database, dan menjalankan migration pertama. Kalau kamu datang dari framework lain, kurva belajarnya cukup landai — sebagian besar konsepnya mirip dengan yang sudah kamu kenal.
