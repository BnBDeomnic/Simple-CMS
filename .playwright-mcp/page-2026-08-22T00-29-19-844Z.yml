                - paragraph [ref=f13e36]: "Laravel jadi salah satu framework PHP paling populer, dan itu bukan tanpa alasan: framework ini mengurus bagian-bagian repetitif dalam membangun aplikasi web — routing, autentikasi, migrasi database — supaya kamu bisa fokus ke fitur yang benar-benar penting buat pengguna."
                - heading "Kenapa Laravel?" [level=2] [ref=f13e37]
                - paragraph [ref=f13e38]: Kalau kamu pernah pakai PHP sebelum era Laravel, kamu tahu betapa banyaknya boilerplate yang dulu terlibat bahkan untuk aplikasi CRUD sederhana. Eloquent ORM, routing yang ekspresif, dan tooling bawaan (Artisan) memangkas itu semua secara drastis.
                - list [ref=f13e39]:
